<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faf8">
  <title>咚咚 · 桌面传送门</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./pet.css">
  <link rel="stylesheet" href="./animations.css">
  <script src="./mascot-animator.js" defer></script>
  <script src="./connection-policy.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="window" id="window">
    <header class="titlebar">
      <div class="brand"><span>咚咚</span></div>
      <div class="title-actions">
        <span class="status" id="status">待连接</span>
        <button class="icon-button desktop-only" id="pinButton" title="取消置顶" aria-label="切换置顶" hidden><img src="./icons/pin.svg" alt=""></button>
        <button class="icon-button" id="settingsButton" title="设置" aria-label="打开设置"><img src="./icons/settings.svg" alt=""></button>
        <button class="icon-button desktop-only" id="closeButton" title="关闭" aria-label="关闭"><img src="./icons/x.svg" alt=""></button>
      </div>
    </header>

    <section class="setup" id="setup">
      <div class="setup-art">
        <div class="mascot small" id="setupMascot" aria-hidden="true"></div>
        <span class="orbit-dot dot-a"></span><span class="orbit-dot dot-b"></span>
      </div>
      <h1>连接房间</h1>
      <div class="segmented" role="tablist" aria-label="连接方式">
        <button id="hostTab" class="selected" role="tab" aria-selected="true">创建房间</button>
        <button id="joinTab" role="tab" aria-selected="false">加入房间</button>
      </div>
      <form id="hostForm" class="setup-form">
        <label>你的名字<input id="hostName" maxlength="24" autocomplete="nickname" placeholder="给对方看的名字" required></label>
        <label>Tailscale 地址<select id="hostAddress" required></select></label>
        <button class="primary-button" type="submit">开启房间 <img src="./icons/arrow-right.svg" alt=""></button>
      </form>
      <form id="joinForm" class="setup-form" hidden>
        <label>你的名字<input id="joinName" maxlength="24" autocomplete="nickname" placeholder="给对方看的名字" required></label>
        <label>对方的 Tailscale 地址<input id="joinAddress" inputmode="url" placeholder="100.x.y.z" required></label>
        <div class="scan-heading"><span>同一 Tailscale 网络</span><button id="scanPeersButton" type="button" title="重新扫描设备"><img src="./icons/scan-search.svg" alt="">扫描设备</button></div>
        <div class="scan-results" id="scanResults" aria-live="polite" hidden></div>
        <label>配对码<input id="joinKey" autocomplete="off" spellcheck="false" placeholder="从对方那里获取" required></label>
        <button class="primary-button" type="submit">加入房间 <img src="./icons/arrow-right.svg" alt=""></button>
      </form>
      <p class="feedback" id="setupFeedback" role="alert"></p>
    </section>

    <section class="app-settings" id="appSettings" hidden>
      <div class="settings-heading">
        <button class="view-back-button" id="settingsBackButton" type="button" title="回到连接"><img src="./icons/arrow-left.svg" alt=""><span>回到连接</span></button>
        <h1>应用设置</h1>
      </div>
      <div id="setupPreferences">
        <section class="preference-settings" id="preferenceSettings" aria-labelledby="preferencesTitle">
          <h2 class="settings-title" id="preferencesTitle">应用偏好</h2>
          <p class="settings-intro">调整小橘的启动方式和陪伴节奏。</p>
          <label class="setting-row" for="autoLaunchSetup"><span><strong>开机自启动</strong><small>登录系统后自动打开小橘</small></span><input type="checkbox" id="autoLaunchSetup"></label>
          <label class="setting-row" for="idleActionsToggle"><span><strong>允许小猫自己玩</strong><small>对方在线时偶尔眨眼、打盹或撒娇</small></span><input type="checkbox" id="idleActionsToggle" checked></label>
          <label class="setting-row" for="edgeHideToggle"><span><strong>长时间无操作时靠边</strong><small>偶尔出来活动，互动后会留下片刻</small></span><input type="checkbox" id="edgeHideToggle"></label>
          <label class="setting-row" for="desktopNotificationsToggle"><span><strong>桌面通知</strong><small>收到消息或文件时提醒我</small></span><input type="checkbox" id="desktopNotificationsToggle" checked></label>
        </section>
      </div>
    </section>

    <section class="companion" id="companion" hidden>
      <div class="companion-main">
        <div class="speech" id="speech" aria-live="polite"></div>
        <div class="couple-badge" id="coupleBadge" hidden><span id="petNameLabel">小橘</span></div>
        <button class="mascot-button" id="mascotButton" title="摸摸小橘" aria-label="摸摸小橘"><span class="mascot" id="mainMascot"></span><span class="voice-bubble" id="voiceBubble" aria-live="polite" hidden></span></button>
        <span class="floor-shadow"></span>
        <div class="context-menu" id="contextMenu" hidden>
          <button id="contextHistory">消息记录</button>
          <button id="contextSettings">设置</button>
        </div>
      </div>
      <div class="compact-actions" id="compactActions">
        <button class="action-button wave-button" id="waveButton" title="向对方招手"><img src="./icons/hand.svg" alt=""><span>招手</span></button>
        <button class="action-button" id="actionMenuButton" title="更多动作"><img src="./icons/sparkles.svg" alt=""><span>动作</span></button>
        <button class="action-button" id="careButton" title="给对方一句关心"><img src="./icons/heart.svg" alt=""><span>关心</span></button>
        <button class="action-button" id="openButton" title="写消息"><img src="./icons/message-circle.svg" alt=""><span>消息</span></button>
        <button class="action-button" id="quickFileButton" title="发送文件"><img src="./icons/paperclip.svg" alt=""><span>文件</span></button>
      </div>
      <form class="quick-composer" id="quickMessageForm" hidden>
        <input id="quickMessageInput" maxlength="1000" placeholder="写一句话…" aria-label="快速消息" autocomplete="off">
        <button class="send-button" type="submit" title="发送" aria-label="发送"><img src="./icons/arrow-up.svg" alt=""></button>
        <button class="quick-close-button" id="quickMessageClose" type="button" title="收起" aria-label="收起消息输入"><img src="./icons/x.svg" alt=""></button>
      </form>
      <div class="action-tray" id="actionTray" hidden>
        <button class="action-choice" data-action="pet"><span>🤍</span>摸摸</button>
        <button class="action-choice" data-action="fish"><span>🐟</span>小鱼干</button>
        <button class="action-choice" data-action="walk"><img src="./icons/footprints.svg" alt="">散步</button>
        <button class="action-choice" data-action="sit"><span>🪑</span>坐下</button>
        <button class="action-choice" data-action="sleep"><span>💤</span>睡觉</button>
        <button class="action-choice" data-action="stretch"><span>☀</span>伸懒腰</button>
        <button class="action-choice" data-action="jump"><img src="./icons/sparkles.svg" alt="">蹦跶</button>
        <button class="action-choice" data-action="hug"><span>🫂</span>抱抱</button>
        <button class="action-choice" data-action="kiss"><span>💋</span>亲亲</button>
        <button class="action-choice" data-action="groom"><span>🧶</span>梳毛</button>
        <button class="action-choice" data-action="purr"><span>💗</span>呼噜</button>
        <button class="action-choice action-close" id="actionTrayClose" title="收起动作" aria-label="收起动作"><img src="./icons/x.svg" alt="">收起</button>
      </div>
      <div class="expanded" id="expanded" hidden>
        <div class="tabs" role="tablist" aria-label="房间视图">
          <button class="selected" id="chatTab" role="tab" aria-selected="true">对话</button>
          <button id="connectionTab" role="tab" aria-selected="false">设置</button>
          <button class="collapse-button return-button" id="collapseButton" title="回到小猫" aria-label="回到小猫"><img src="./icons/arrow-left.svg" alt=""><span>回到小猫</span></button>
        </div>
        <div id="chatView" class="chat-view">
          <div class="events" id="events" aria-live="polite"></div>
          <form class="composer" id="messageForm">
            <button type="button" class="icon-button attach-button" id="fileButton" title="发送文件" aria-label="发送文件"><img src="./icons/paperclip.svg" alt=""></button>
            <input id="messageInput" maxlength="1000" placeholder="写一句话…" aria-label="消息内容" autocomplete="off">
            <button class="send-button" type="submit" title="发送" aria-label="发送"><img src="./icons/arrow-up.svg" alt=""></button>
          </form>
        </div>
        <div id="connectionView" class="connection-view" hidden>
          <div id="connectionPreferences"></div>
          <section class="room-settings" aria-labelledby="roomSettingsTitle">
          <h2 class="settings-title" id="roomSettingsTitle">房间设置</h2>
          <div class="presence-card"><span class="presence-dot" id="presenceDot"></span><span id="presenceText">正在检查对方状态…</span></div>
          <p class="connection-label">房间地址</p><div class="copy-line"><code id="roomAddress"></code><button class="icon-button copy-button" id="copyAddress" title="复制地址" aria-label="复制地址"><img src="./icons/copy.svg" alt=""></button></div>
          <div id="hostKeyBlock"><p class="connection-label">配对码</p><div class="copy-line"><code id="roomKey"></code><button class="icon-button copy-button" id="copyKey" title="复制配对码" aria-label="复制配对码"><img src="./icons/copy.svg" alt=""></button></div></div>
          <p class="connection-hint">把地址和配对码发给对方。收到的文件会保存到本机“下载”文件夹。</p>
          <div class="shared-profile">
            <h3>你们的小窝</h3>
            <label>小猫昵称<input id="profilePetName" maxlength="24" placeholder="例如：橘子"></label>
            <button class="secondary-button" id="saveProfileButton" type="button">保存共享资料</button>
          </div>
          <button class="text-button" id="openDownloadsButton" type="button">打开下载文件夹</button>
          <button class="text-button disconnect-button" id="disconnectButton">退出房间</button>
          </section>
        </div>
      </div>
    </section>
    <div class="drop-overlay" id="dropOverlay" hidden><img src="./icons/file-up.svg" alt=""><span>松开发送文件</span></div>
    <input id="fileInput" type="file" hidden>
    <div class="toast" id="toast" role="status" hidden></div>
  </main>
</body>
</html>
